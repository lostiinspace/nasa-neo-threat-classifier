name: Weekly NEO Model Retrain

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Expand catalog & retrain Random Forest
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python src/train.py

      - name: Commit updated model & metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/ metrics_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: weekly model retrain and metrics log"
          git push